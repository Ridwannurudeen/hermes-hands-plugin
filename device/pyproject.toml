[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-hands"
version = "0.2.0"
description = "A signed device agent for Hermes Hands"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<1", "cryptography>=42,<51", "mss>=9,<11", "Pillow>=10,<13", "psutil>=5.9,<8"]

[project.optional-dependencies]
keyring = ["keyring>=24,<26"]

[project.scripts]
hermes-hands = "hermeshands_device.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hermeshands_device"]
